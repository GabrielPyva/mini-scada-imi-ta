<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMI-TA SMART SCADA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@100;200;300;400;500;600;700&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        :root {
            --background: #0b0e13;
            --foreground: #e6edf5;
            --border: #232c3a;
            --input: #151c27;
            --panel: #111722;
            --panel2: #182031;
            --primary: #2fd4ff;
            --primary-foreground: #04222c;
            --secondary-foreground: #aebdcd;
            --muted-foreground: #7e8ca1;
            --hot: #ff7a45;
            --accent: #ffb224;
            --success: #2fe080;
            --danger: #ff5d5d;
            --font-body: "Inter", "Segoe UI", sans-serif;
            --font-headings: "IBM Plex Mono", "SFMono-Regular", monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--background);
            color: var(--foreground);
            font-family: var(--font-body);
        }

        body {
            min-height: 100vh;
            padding: 32px 20px 40px;
        }

        button,
        input {
            font: inherit;
        }

        .app-shell {
            max-width: 1100px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
        }

        .title-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .eyebrow {
            font-family: var(--font-headings);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-weight: 700;
            font-size: 11px;
            color: var(--muted-foreground);
        }

        .title-block h1 {
            margin: 0;
            font-size: clamp(1.6rem, 2vw, 2.2rem);
            line-height: 1.1;
            font-weight: 700;
        }

        .connection-form {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(17, 23, 34, 0.9);
            min-height: 58px;
        }

        .connection-form label {
            color: var(--secondary-foreground);
            font-size: 0.78rem;
            font-family: var(--font-headings);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .connection-form input {
            width: 180px;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--foreground);
            padding: 10px 12px;
            outline: none;
        }

        .connection-form input:focus {
            border-color: rgba(47, 212, 255, 0.7);
            box-shadow: 0 0 0 2px rgba(47, 212, 255, 0.15);
        }

        .connection-form button {
            border: 1px solid rgba(47, 212, 255, 0.34);
            background: rgba(47, 212, 255, 0.12);
            color: var(--primary);
            padding: 10px 16px;
            border-radius: 10px;
            font-family: var(--font-headings);
            font-size: 0.76rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .connection-form button:hover {
            background: rgba(47, 212, 255, 0.2);
        }

        #connection-status {
            color: var(--muted-foreground);
            font-family: var(--font-headings);
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            min-width: 140px;
            text-align: right;
        }

        .dashboard {
            display: grid;
            grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
            gap: 22px;
            align-items: start;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 18px 28px rgba(0, 0, 0, 0.14);
        }

        .controls {
            padding: 18px;
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            font-family: var(--font-headings);
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted-foreground);
            margin-bottom: 12px;
        }

        .mode-trigger {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 16px;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--foreground);
            text-align: left;
            font-family: var(--font-headings);
            font-size: 0.79rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .mode-trigger::after {
            content: "▾";
            color: var(--muted-foreground);
            font-size: 1rem;
        }

        #register-122-options {
            margin-top: 8px;
            display: grid;
            gap: 8px;
        }

        #register-122-options[hidden] {
            display: none;
        }

        #register-122-options button {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(24, 32, 49, 0.9);
            color: var(--secondary-foreground);
            font-family: var(--font-headings);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .setpoint-card {
            margin-top: 20px;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .setpoint-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            color: var(--secondary-foreground);
        }

        .setpoint-header strong {
            font-family: var(--font-headings);
            font-size: 1.1rem;
            color: var(--primary);
        }

        .setpoint-range {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary) var(--percent, 50%), var(--input) var(--percent, 50%), var(--input) 100%);
            outline: none;
        }

        .setpoint-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            background: var(--panel);
            cursor: pointer;
            box-shadow: 0 0 0 3px rgba(47, 212, 255, 0.18);
        }

        .setpoint-range::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            background: var(--panel);
            cursor: pointer;
            box-shadow: 0 0 0 3px rgba(47, 212, 255, 0.18);
        }

        .setpoint-scale {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            font-family: var(--font-headings);
            font-size: 0.72rem;
            color: var(--muted-foreground);
        }

        .setpoint-number {
            width: 100%;
            margin-top: 12px;
            border: 1px solid var(--border);
            background: var(--input);
            color: var(--foreground);
            border-radius: 10px;
            padding: 10px 12px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 18px;
        }

        .metric-card {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px 18px 16px;
            min-height: 176px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.01);
        }

        .metric-label {
            font-family: var(--font-headings);
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted-foreground);
        }

        .metric-value {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-top: 12px;
            font-family: var(--font-headings);
            line-height: 1;
        }

        .metric-value .reading {
            font-size: clamp(2rem, 3vw, 2.7rem);
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        .metric-value .unit {
            font-size: 0.76rem;
            color: var(--muted-foreground);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .temperature-value .reading {
            font-size: clamp(1.7rem, 2.6vw, 2.1rem);
            letter-spacing: -0.04em;
        }

        .temperature-value {
            gap: 4px;
            flex-wrap: wrap;
        }

        .metric-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 12px;
            color: var(--muted-foreground);
            font-size: 0.77rem;
            font-family: var(--font-body);
        }

        .metric-meta .delta {
            font-family: var(--font-headings);
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--success);
        }

        .metric-progress {
            margin-top: 14px;
            height: 6px;
            border-radius: 999px;
            background: var(--input);
            overflow: hidden;
            position: relative;
        }

        .metric-progress span {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--primary) 0%, rgba(47, 212, 255, 0.9) 100%);
        }

        .metric-card.power .reading { color: var(--accent); }
        .metric-card.flow .reading { color: var(--primary); }
        .metric-card.temperature .reading { color: var(--hot); }
        .metric-card.valve .reading { color: var(--success); }

        .metric-card.power .metric-progress span {
            background: linear-gradient(90deg, var(--accent) 0%, rgba(255, 178, 36, 0.9) 100%);
        }

        .metric-card.temperature .metric-progress span {
            background: linear-gradient(90deg, var(--hot) 0%, rgba(255, 122, 69, 0.9) 100%);
        }

        .metric-card.valve .metric-progress span {
            background: linear-gradient(90deg, var(--success) 0%, rgba(47, 224, 128, 0.9) 100%);
        }

        @media (max-width: 860px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .connection-form {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="title-block">
                <span class="eyebrow">Valve control</span>
                <h1>IMI-TA SMART DN20</h1>
            </div>

            <form id="connection-form" class="connection-form">
                <label for="modbus-ip">Device IP</label>
                <input id="modbus-ip" type="text" inputmode="decimal" autocomplete="off" required />
                <button type="submit">Connect</button>
                <span id="connection-status" role="status" aria-live="polite">not connected</span>
            </form>
        </header>

        <main class="dashboard">
            <aside class="panel controls" aria-labelledby="control-heading">
                <div id="control-heading" class="section-label">Control</div>

                <button id="register-122-value" class="mode-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">--</button>
                <div id="register-122-options" role="listbox" aria-label="Register 122 options" hidden>
                    <button type="button" role="option" data-value="1">Flow Control</button>
                    <button type="button" role="option" data-value="2">Power Control</button>
                    <button type="button" role="option" data-value="3">Dp Control</button>
                    <button type="button" role="option" data-value="4">Position Control</button>
                </div>

                <div class="setpoint-card">
                    <div class="setpoint-header">
                        <span>Setpoint</span>
                        <strong id="slider-value-readout">40</strong>
                    </div>
                    <input id="value-slider" class="setpoint-range" type="range" value="40" step="any" min="0" max="100" />
                    <div class="setpoint-scale">
                        <span>0</span>
                        <span>100</span>
                    </div>
                    <input id="slider-value" class="setpoint-number" type="number" value="40" step="any" min="0" max="100" />
                </div>
            </aside>

            <section class="metrics-grid" aria-label="Measured values">
                <article class="metric-card flow">
                    <div class="metric-label">Flow</div>
                    <div class="metric-value">
                        <span class="reading" id="MeasuredFlow_unit1">--</span>
                        <span class="unit">m³/h</span>
                    </div>
                    <div class="metric-meta">
                        <span>Live</span>
                        <span class="delta">OK</span>
                    </div>
                    <div class="metric-progress"><span style="width: 62%"></span></div>
                </article>

                <article class="metric-card power">
                    <div class="metric-label">Power</div>
                    <div class="metric-value">
                        <span class="reading" id="MeasuredPower_unit1">--</span>
                        <span class="unit">kW</span>
                    </div>
                    <div class="metric-meta">
                        <span>Live</span>
                        <span class="delta">OK</span>
                    </div>
                    <div class="metric-progress"><span style="width: 62%"></span></div>
                </article>

                <article class="metric-card temperature">
                    <div class="metric-label">Supply / Return</div>
                    <div class="metric-value temperature-value">
                        <span class="reading" id="MeasuredSupplyTemp_degC">--</span>
                        <span class="unit">/</span>
                        <span class="reading" id="MeasuredReturnTemp_degC">--</span>
                        <span class="unit">°C</span>
                    </div>
                    <div class="metric-meta">
                        <span>Live</span>
                        <span class="delta">stable</span>
                    </div>
                    <div class="metric-progress"><span style="width: 62%"></span></div>
                </article>

                <article class="metric-card valve">
                    <div class="metric-label">Valve Position</div>
                    <div class="metric-value">
                        <span class="reading" id="RelativeMeasuredPosition">--</span>
                        <span class="unit">%</span>
                    </div>
                    <div class="metric-meta">
                        <span>Live</span>
                        <span class="delta">auto</span>
                    </div>
                    <div class="metric-progress"><span style="width: 62%"></span></div>
                </article>
            </section>
        </main>
    </div>

    <script>
        const connectionForm = document.getElementById('connection-form');
        const modbusIp = document.getElementById('modbus-ip');
        const connectionStatus = document.getElementById('connection-status');
        const slider = document.getElementById('value-slider');
        const sliderValue = document.getElementById('slider-value');
        const sliderValueReadout = document.getElementById('slider-value-readout');
        const register122Value = document.getElementById('register-122-value');
        const register122Options = document.getElementById('register-122-options');
        const register122Labels = {
            1: 'Flow Control',
            2: 'Power Control',
            3: 'Dp Control',
            4: 'Position Control'
        };

        connectionForm.addEventListener('submit', (event) => {
            event.preventDefault();
            window.electronAPI.connectModbus(modbusIp.value.trim());
        });

        window.electronAPI.onConnectionStatusUpdated((status) => {
            connectionStatus.textContent = status;
        });

        register122Value.addEventListener('click', () => {
            const isExpanded = register122Value.getAttribute('aria-expanded') === 'true';
            register122Options.hidden = isExpanded;
            register122Value.setAttribute('aria-expanded', String(!isExpanded));
        });

        register122Options.addEventListener('click', (event) => {
            const option = event.target.closest('[data-value]');
            if (!option) return;

            window.electronAPI.writeRegister122(Number(option.dataset.value));
            register122Options.hidden = true;
            register122Value.setAttribute('aria-expanded', 'false');
        });

        function syncSetpointReading() {
            const currentValue = Number(slider.value);
            const displayValue = Number.isFinite(currentValue) ? currentValue : 0;
            const percent = (displayValue / Number(slider.max || 100)) * 100;
            sliderValue.value = displayValue;
            sliderValueReadout.textContent = displayValue.toFixed(1);
            slider.style.setProperty('--percent', `${percent}%`);
        }

        function updateFromSlider() {
            syncSetpointReading();
            sendSliderValue();
        }

        function sendSliderValue() {
            const value = sliderValue.valueAsNumber;
            if (Number.isFinite(value)) {
                window.electronAPI.sendSliderValue(value);
            }
        }

        slider.addEventListener('input', updateFromSlider);
        sliderValue.addEventListener('input', () => {
            slider.value = sliderValue.value;
            updateFromSlider();
        });

        function formatMeasuredValue(name, value) {
            if (value === null || value === undefined || value === '') {
                return '--';
            }

            const numericValue = Number(value);
            if (!Number.isFinite(numericValue)) {
                return String(value);
            }

            if (name === 'MeasuredSupplyTemp_degC' || name === 'MeasuredReturnTemp_degC') {
                return numericValue.toFixed(1);
            }

            if (name === 'RelativeMeasuredPosition') {
                return String(Math.round(numericValue));
            }

            return String(value);
        }

        window.electronAPI.onMeasuredValuesUpdated((values) => {
            Object.entries(values).forEach(([name, value]) => {
                if (name === 'Register122') {
                    register122Value.textContent = register122Labels[value] ?? value ?? '--';
                    return;
                }

                const target = document.getElementById(name);
                if (target) {
                    target.textContent = formatMeasuredValue(name, value);
                }
            });
        });

        syncSetpointReading();
        sendSliderValue();
    </script>
</body>
</html>
