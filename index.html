<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mini SCADA</title>
</head>
<body>
    <h1>Measured values</h1>

    <dl id="measured-values">
        <dt>Measured flow (unit 1)</dt>
        <dd id="MeasuredFlow_unit1">--</dd>
        <dt>Measured supply temperature (degC)</dt>
        <dd id="MeasuredSupplyTemp_degC">--</dd>
        <dt>Measured return temperature (degC)</dt>
        <dd id="MeasuredReturnTemp_degC">--</dd>
        <dt>Measured delta T (K)</dt>
        <dd id="MeasuredDeltaT_K">--</dd>
        <dt>Measured power (unit 1)</dt>
        <dd id="MeasuredPower_unit1">--</dd>
        <dt>Relative measured position</dt>
        <dd id="RelativeMeasuredPosition">--</dd>
        <dt>Energy counter regime 1 (unit 1)</dt>
        <dd id="EnergyCounterRegime1_unit1">--</dd>
        <dt>Energy counter regime 2 (unit 1)</dt>
        <dd id="EnergyCounterRegime2_unit1">--</dd>
    </dl>

    <form id="formulary">
        <input id="value-slider" type="range" value="40" />
        <output id="slider-value" for="value-slider">150</output>
    </form>

    <script>
        const form = document.getElementById('formulary');
        const slider = document.getElementById('value-slider');
        const sliderValue = document.getElementById('slider-value');
        
        function updateResult() {
            const output = slider.valueAsNumber;
            sliderValue.value = output;
            sendSliderValue();
        }

        function sendSliderValue () {
            window.electronAPI.sendSliderValue(Number(sliderValue.value));
        }

        form.addEventListener('input', updateResult);

        window.electronAPI.onMeasuredValuesUpdated((values) => {
            Object.entries(values).forEach(([name, value]) => {
                document.getElementById(name).textContent = value;
            });
        });

        updateResult();
    </script>
</body>
</html>
